<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


  
    <div class="pesquisa-box">
        <h3>Pesquisar Livro</h3>
        <div class="pesquisa-grupo">
            <input type="text" id="input-busca" placeholder="Digite o ID ou título do livro...">
            <button type="button" id="btn-buscar">Pesquisar</button>
        </div>
    </div>


    <h1>Catálogo de Livros</h1>

  
    <div id="mensagem" class="oculto" role="alert" aria-live="assertive"></div>

    <form id="livro-form">
        <h2 id="form-titulo">Adicionar Livro</h2>
        
      
        <input type="hidden" id="livro-id">

        <div>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Ex: Dom Casmurro">
        </div>

        <div>
            <label for="autor">Autor:</label>
            <input type="text" id="autor" placeholder="Ex: Machado de Assis">
        </div>

        <button type="submit" id="btn-salvar">Salvar</button>
        <button type="button" id="btn-cancelar" class="oculto">Cancelar</button>
    </form>

    <hr>


    <h2>Livros Cadastrados</h2>


    <p id="loading" class="oculto">Carregando livros...</p>
    <p id="lista-vazia" class="oculto">Nenhum livro encontrado.</p>

    ()


    <table id="tabela-livros" class="oculto">
        <thead>
            
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">

        </tbody>
    </table>

    <script src="main.js"></script>
   

    <!-- card  para exibir os dados retotnadps pela api -->
    <div id="card-livro" class="card-detalhes oculto">
        <div class="card-header-detalhes">
            <h3>Resultado da Pesquisa</h3>
            <button type="button" id="btn-fechar-card" class="btn-fechar" title="Fechar">&times;</button>
        </div>
        <div class="card-corpo">
            <p><strong>ID:</strong> <span id="card-id">-</span></p>
            <p><strong>Título:</strong> <span id="card-titulo">-</span></p>
            <p><strong>Autor:</strong> <span id="card-autor">-</span></p>
        </div>
    </div>


   
    

</body>
</html>1
